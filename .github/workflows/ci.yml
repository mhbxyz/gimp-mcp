name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Lint, types, unit tests (no GIMP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest tests/unit -ra
      - name: Public API changes against the base branch (docs/api/contract.json)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          uv run scripts/api_contract.py check --base FETCH_HEAD

  unit-os:
    name: Unit tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -ra

  e2e-macos:
    name: End-to-end on macOS 15 (arm64) with GIMP 3.2.6
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade test builds the previous release from history
      - name: Install GIMP 3.2.6 from gimp.org (SHA-256 verified)
        run: ci/install-gimp-macos.sh
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: End-to-end tests on a real GIMP
        env:
          GIMP_MCP_REQUIRE_GIMP: "1"
          GIMP_MCP_TRACE: ${{ runner.temp }}/gimp-mcp-trace.txt
        run: uv run pytest tests/e2e -ra
      - name: Last lines of the plug-in trace
        if: failure()
        run: tail -40 "$RUNNER_TEMP/gimp-mcp-trace.txt" || true

  e2e-windows:
    name: End-to-end on Windows Server 2025 with GIMP 3.2.6
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade test builds the previous release from history
      - name: Install GIMP 3.2.6 from gimp.org (SHA-256 verified)
        shell: pwsh
        run: ci/install-gimp-windows.ps1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: End-to-end tests on a real GIMP
        env:
          GIMP_MCP_REQUIRE_GIMP: "1"
        run: uv run pytest tests/e2e -ra

  gui-linux:
    name: GIMP with its interface on Linux (Xvfb)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: GUI end-to-end tests (GIMP 3.2 window on a virtual display, keys sent with xdotool)
        run: ci/run-gui.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gui-linux-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore

  gui-macos:
    name: GIMP with its interface on macOS 15
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install GIMP 3.2.6 from gimp.org (SHA-256 verified)
        run: ci/install-gimp-macos.sh
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: GUI end-to-end tests (GIMP.app window, keys sent with osascript)
        env:
          GIMP_MCP_GUI: "1"
          GIMP_MCP_REQUIRE_GIMP: "1"
        run: uv run pytest tests/gui -ra

  gui-windows:
    name: GIMP with its interface on Windows Server 2025
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install GIMP 3.2.6 from gimp.org (SHA-256 verified)
        shell: pwsh
        run: ci/install-gimp-windows.ps1
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: GUI end-to-end tests (GIMP window, keys sent with WScript.Shell)
        env:
          GIMP_MCP_GUI: "1"
          GIMP_MCP_REQUIRE_GIMP: "1"
        run: uv run pytest tests/gui -ra

  e2e:
    name: End-to-end with GIMP 3.2.6 (pinned Arch snapshot)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the upgrade test builds the previous release from history
      - uses: docker/setup-buildx-action@v3
      - name: Build the pinned GIMP image
        uses: docker/build-push-action@v6
        with:
          context: ci
          load: true
          tags: gimp-mcp-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Unit + end-to-end tests against a real GIMP
        env:
          GIMP_MCP_CI_SKIP_BUILD: "1"
        run: ci/run-e2e.sh
      - name: Upload GIMP logs and test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: ci-artifacts/
          if-no-files-found: ignore

  flatpak:
    name: End-to-end with Flatpak GIMP (Flathub, pinned commit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the Flatpak GIMP image
        uses: docker/build-push-action@v6
        with:
          context: ci
          file: ci/Dockerfile.flatpak
          load: true
          tags: gimp-mcp-flatpak-ci
          cache-from: type=gha,scope=flatpak
          cache-to: type=gha,mode=max,scope=flatpak
      - name: Flatpak end-to-end tests
        env:
          GIMP_MCP_CI_SKIP_BUILD: "1"
        run: ci/run-flatpak-e2e.sh

  docs:
    name: Documented commands in a clean Ubuntu 26.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run the README quickstart and the client pages' commands
        run: ci/run-doctests.sh
