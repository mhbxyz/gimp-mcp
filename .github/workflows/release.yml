name: Release

# Builds the artifacts once, tests them with a real GIMP on Linux, macOS and
# Windows (gimp-os-tests.yml), attests their provenance, then:
#   * creates (or updates) a draft GitHub release with artifacts, checksums and notes;
#   * publishes the same files to TestPyPI (approval in the `testpypi` environment),
#     verifies them there on every OS, then promotes them to PyPI (approval in the
#     `pypi` environment) and verifies the published package on every OS;
#   * only then makes the GitHub release public.
# Every step can be re-run safely. A dry run (manual run with dry_run=true, from
# any branch) builds and tests everything and publishes nothing.
#
# Publishing uses PyPI trusted publishing (OIDC): no token is stored anywhere.
# The publish jobs must stay in THIS file: PyPI does not accept reusable
# workflows as trusted publishers (see docs/adr/0002-release-pipeline.md).
on:
  push:
    tags: ["v*"]
  # Started by tag-release.yml when a "Release vX.Y.Z" PR is merged, or by hand:
  # "Run workflow" with "Use workflow from" set to the tag (the testpypi/pypi
  # environments only accept deployments from v* tags), or dry_run=true anywhere.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and test only; publish nothing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.ref_name }}

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      pre_release: ${{ steps.version.outputs.pre_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - id: version
        name: Check the tag matches the package version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          version=$(uv run --quiet python -c "import gimp_mcp; print(gimp_mcp.__version__)")
          if [ "$DRY_RUN" != "true" ]; then test "v$version" = "$RELEASE_REF"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-release (1.0.0rc1, aN, bN): a GitHub pre-release, not in the MCP registry (#124)
          if echo "$version" | grep -Eq '(a|b|rc)[0-9]+$'; then pre=true; else pre=false; fi
          echo "pre_release=$pre" >> "$GITHUB_OUTPUT"
      - run: scripts/build-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  test:
    name: Full test suite with a real GIMP
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0 # the upgrade test builds the previous release from history
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci
          load: true
          tags: gimp-mcp-ci
          cache-from: type=gha
      - name: Unit + end-to-end tests (includes the built-wheel test)
        env:
          GIMP_MCP_CI_SKIP_BUILD: "1"
        run: ci/run-e2e.sh

  test-os:
    name: Full test suite on ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    uses: ./.github/workflows/gimp-os-tests.yml
    with:
      os: ${{ matrix.os }}
      ref: ${{ github.ref_name }}
      version: ${{ needs.build.outputs.version }}
      tests: tests/unit tests/e2e

  attest:
    name: Attest build provenance
    needs: [build, test, test-os]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  github-draft:
    name: Draft GitHub release
    needs: [build, test, test-os, attest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Create or update the draft release (never touches a published one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRE_RELEASE: ${{ needs.build.outputs.pre_release }}
        run: |
          kind=""
          if [ "$PRE_RELEASE" = "true" ]; then kind="--prerelease"; fi
          if draft=$(gh release view "$RELEASE_REF" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then echo "release $RELEASE_REF is already public"; exit 1; fi
            gh release edit "$RELEASE_REF" --notes-file dist/RELEASE_NOTES.md
            gh release upload "$RELEASE_REF" --clobber dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          else
            gh release create "$RELEASE_REF" --draft $kind --verify-tag --title "gimp-mcp ${RELEASE_REF#v}" \
              --notes-file dist/RELEASE_NOTES.md dist/*.whl dist/*.tar.gz dist/SHA256SUMS
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test, test-os, attest]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/project/gimp-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Keep only the distributions
        run: mkdir packages && cp dist/*.whl dist/*.tar.gz packages/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: packages/
          skip-existing: true

  verify-testpypi:
    name: Verify the TestPyPI upload
    needs: [build, publish-testpypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Same files on TestPyPI as built (SHA-256), downloaded for testing
        run: python3 scripts/verify_published.py testpypi "${{ needs.build.outputs.version }}" dist/SHA256SUMS --download wheels
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci
          load: true
          tags: gimp-mcp-ci
          cache-from: type=gha
      - name: Installed package drives a real GIMP
        env:
          GIMP_MCP_CI_SKIP_BUILD: "1"
          GIMP_MCP_CI_ENV: GIMP_MCP_DIST_WHEEL=/src/wheels/gimp_mcp-${{ needs.build.outputs.version }}-py3-none-any.whl
        run: ci/run-e2e.sh tests/e2e/test_distribution.py

  verify-testpypi-os:
    name: TestPyPI upload on ${{ matrix.os }}
    needs: [build, publish-testpypi]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    uses: ./.github/workflows/gimp-os-tests.yml
    with:
      os: ${{ matrix.os }}
      ref: ${{ github.ref_name }}
      version: ${{ needs.build.outputs.version }}
      tests: tests/e2e/test_distribution.py
      index: testpypi

  publish-pypi:
    name: Publish to PyPI
    needs: [build, verify-testpypi, verify-testpypi-os]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/gimp-mcp/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
          path: source
      - id: existing
        name: Already on PyPI? (safe re-runs)
        run: |
          if python3 source/scripts/verify_published.py pypi "${{ needs.build.outputs.version }}" dist/SHA256SUMS --once; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep only the distributions
        run: mkdir packages && cp dist/*.whl dist/*.tar.gz packages/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.existing.outputs.published != 'true'
        with:
          packages-dir: packages/

  verify-pypi:
    name: Verify the PyPI release
    needs: [build, publish-pypi]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Same files on PyPI as built (SHA-256)
        run: python3 scripts/verify_published.py pypi "${{ needs.build.outputs.version }}" dist/SHA256SUMS
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Wait until PyPI's index serves the release (its CDN lags behind the JSON API)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in $(seq 1 40); do
            # both installers used next: for v0.5.0 pip was served the release while uv, seconds later, was not
            if pip download --quiet --no-deps --no-cache-dir --dest "$RUNNER_TEMP/probe" "gimp-mcp==$VERSION" &&
              uvx --no-cache --from "gimp-mcp==$VERSION" gimp-mcp --version; then
              echo "served after $attempt attempt(s)"; exit 0
            fi
            sleep 15
          done
          echo "PyPI's index still does not serve gimp-mcp==$VERSION after 10 minutes"; exit 1
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ci
          load: true
          tags: gimp-mcp-ci
          cache-from: type=gha
      - name: Package installed from PyPI (pip and uvx) drives a real GIMP
        env:
          GIMP_MCP_CI_SKIP_BUILD: "1"
          GIMP_MCP_CI_ENV: GIMP_MCP_DIST_REQUIREMENT=gimp-mcp==${{ needs.build.outputs.version }}
        run: ci/run-e2e.sh tests/e2e/test_distribution.py

  verify-pypi-os:
    name: PyPI release on ${{ matrix.os }}
    needs: [build, publish-pypi]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    uses: ./.github/workflows/gimp-os-tests.yml
    with:
      os: ${{ matrix.os }}
      ref: ${{ github.ref_name }}
      version: ${{ needs.build.outputs.version }}
      tests: tests/e2e/test_distribution.py
      index: pypi

  finalize:
    name: Make the GitHub release public
    needs: [build, github-draft, verify-pypi, verify-pypi-os]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft (approved through the pypi environment)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PRE_RELEASE: ${{ needs.build.outputs.pre_release }}
        run: |
          if [ "$PRE_RELEASE" = "true" ]; then
            gh release edit "$RELEASE_REF" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_REF" --draft=false --latest
          fi

  publish-mcp-registry:
    name: Publish to the MCP registry
    needs: [build, verify-pypi, verify-pypi-os]
    # the registry lists the last release; release candidates stay on PyPI and GitHub (#124)
    if: ${{ !inputs.dry_run && needs.build.outputs.pre_release != 'true' }}
    runs-on: ubuntu-24.04
    # Not the pypi environment: this job's OIDC token must not be accepted by PyPI (#122).
    environment:
      name: mcp-registry
      url: https://registry.modelcontextprotocol.io/v0/servers?search=io.github.mhbxyz/gimp-mcp
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.RELEASE_REF }}
      - name: Install mcp-publisher (pinned, checked against the SHA-256 of registry_1.8.3_checksums.txt)
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.3/mcp-publisher_linux_amd64.tar.gz"
          echo "29ed68536ad0bcf8a266d4666995f2b978740c049b8ad29a1c63fe845b2634cf  mcp-publisher.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate, authenticate with GitHub OIDC and publish server.json
        run: |
          test "$(python3 -c "import json; print(json.load(open('server.json'))['version'])")" = "${{ needs.build.outputs.version }}"
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
